version: '3.9'

services:
  db-init:
    extends:
      file: ./services/db.yml
      service: db-init

  db:
    depends_on:
      db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/db.yml
      service: db

  backend:
    depends_on:
      - db
    extends:
      file: ./services/backend.yml
      service: backend
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      args:
        RELEASE_VERSION: 6.10.2
    links:
      - db:database
    environment:
        ETHEREUM_JSONRPC_HTTP_URL: ${ENDPOINT}
        ETHEREUM_JSONRPC_WS_URL: ${WS_ENDPOINT}
        ETHEREUM_JSONRPC_TRACE_URL: ${TRACE_ENDPOINT}
        JSON_RPC: ${ENDPOINT}
        CHAIN_ID: ${CHAIN_ID}
        SUBNETWORK: ${SCHAIN_NAME}
        ETHEREUM_JSONRPC_VARIANT: "geth"
        NETWORK: "FAIR"
        FIRST_BLOCK: ${FIRST_BLOCK:-0}
        TRACE_FIRST_BLOCK: ${FIRST_BLOCK:-0}
        INDEXER_RECEIPTS_BATCH_SIZE: 100
        INDEXER_COIN_BALANCES_BATCH_SIZE: 100
        POOL_SIZE: 130
        INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: "true"
        INDEXER_DISABLE_EMPTY_BLOCKS_SANITIZER: "true"
        ETHEREUM_JSONRPC_DISABLE_ARCHIVE_BALANCES: "true"
        ETHEREUM_JSONRPC_GETH_TRACE_BY_BLOCK: "true"
        INDEXER_CATCHUP_BLOCK_INTERVAL: "10s"
        INDEXER_HIDE_INDEXING_PROGRESS_ALERT: "true"
        CHAIN_SPEC_PATH: "/opt/app/config.json"
        SECRET_KEY_BASE: "RMgI4C1HSkxsEjdhtGMfwAHfyT6CKWXOgzCboJflfSm4jeAlic52io05KB6mqzc5"
        MICROSERVICE_SIG_PROVIDER_ENABLED: "false"
        INDEXER_TOKEN_INSTANCE_RETRY_REFETCH_INTERVAL: "30s"
        ETHEREUM_JSONRPC_DEBUG_TRACE_TRANSACTION_TIMEOUT: "30s"
        RE_CAPTCHA_CLIENT_KEY: "6LesjQUrAAAAAEyS9U4XxT8KC_ZOc50hjOBiX21A"
        RE_CAPTCHA_SECRET_KEY: ${RE_CAPTCHA_SECRET_KEY}
        RE_CAPTCHA_CHECK_HOSTNAME: "false"
        DATABASE_URL: "postgresql://blockscout:${DB_PASSWORD:-ceWb1MeLBEeOIfk65gU8EjF8}@db:5432/blockscout"
        INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: "${INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER:-true}"
        NFT_MEDIA_HANDLER_ENABLED: "false"
        NFT_MEDIA_HANDLER_REMOTE_DISPATCHER_NODE_MODE_ENABLED: "false"
        NOVES_FI_CHAIN_NAME: ${NOVES_FI_CHAIN_NAME}
        NOVES_FI_API_TOKEN: ${NOVES_API_KEY}

  frontend:
    depends_on:
      - backend
    extends:
      file: ./services/frontend.fair.yml
      service: frontend

  stats-db-init:
    extends:
      file: ./services/stats.yml
      service: stats-db-init

  stats-db:
    depends_on:
      stats-db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/stats.yml
      service: stats-db

  stats:
    depends_on:
      - stats-db
      - backend
    extends:
      file: ./services/stats.fair.yml
      service: stats

  proxy:
    depends_on:
      - backend
      - frontend
      - stats
    extends:
      file: ./services/nginx.yml
      service: proxy

  smart-contract-verifier:
    extends:
      file: ./services/smart-contract-verifier.yml
      service: smart-contract-verifier
