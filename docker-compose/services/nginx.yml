version: '3.9'

services:
  proxy:
    image: nginx
    container_name: '${SCHAIN_NAME}_proxy'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ${BLOCKSCOUT_PROXY_CONFIG_DIR:-../proxy}/default.conf.template:/etc/nginx/templates/default.conf.template
      - ${BLOCKSCOUT_SSL_CONFIG_FILE:-/dev/null}:/etc/nginx/templates/ssl.conf
      - ${BLOCKSCOUT_PROXY_CERTS_PATH:-../certs}:/data/
    environment:
      HOST: ${HOST:-localhost}
    ports:
      - target: ${PROXY_BASE_PORT:-80}
        published: ${PROXY_PORT:-80}
      - target: 8080
        published: ${STATS_PORT:-8080}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"
