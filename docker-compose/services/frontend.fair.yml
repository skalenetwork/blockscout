version: '3.9'

services:
  frontend:
    image: skalenetwork/blockscout-frontend:${BLOCKSCOUT_FRONTEND_DOCKER_TAG:-latest}
    pull_policy: always
    platform: linux/amd64
    restart: always
    container_name: '${SCHAIN_NAME}_frontend'
    environment:
      - NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID=${WALLET_CONNECT_PROJECT_ID}
      - NEXT_PUBLIC_API_HOST=${HOST:-localhost}
      - NEXT_PUBLIC_APP_HOST=${HOST:-localhost}
      - NEXT_PUBLIC_API_PORT=${PROXY_PORT:-80}
      - NEXT_PUBLIC_APP_PROTOCOL=http${SSL:+s}
      - NEXT_PUBLIC_API_PROTOCOL=http${SSL:+s}
      - NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL=ws${SSL:+s}
      - NEXT_PUBLIC_STATS_API_HOST=http${SSL:+s}://${HOST:-localhost}:${STATS_PORT:-8080}
      - NEXT_PUBLIC_IS_ACCOUNT_SUPPORTED=false
      - NEXT_PUBLIC_NETWORK_NAME=${SCHAIN_APP_NAME:-FAIR}
      - NEXT_PUBLIC_NETWORK_ID=${CHAIN_ID}
      - NEXT_PUBLIC_NETWORK_CURRENCY_NAME=FAIR
      - NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL=FAIR
      - NEXT_PUBLIC_NETWORK_VERIFICATION_TYPE=validation
      - NEXT_PUBLIC_NETWORK_RPC_URL=${ENDPOINT}
      - NEXT_PUBLIC_GAS_TRACKER_ENABLED=false
      - NEXT_PUBLIC_AD_BANNER_PROVIDER=none
      - NEXT_PUBLIC_AD_TEXT_PROVIDER=none
      - NEXT_PUBLIC_IS_TESTNET=${IS_TESTNET:-false}
      - NEXT_PUBLIC_HIDE_INDEXING_ALERT_BLOCKS=true
      - NEXT_PUBLIC_HIDE_INDEXING_ALERT_INT_TXS=true
      - NEXT_PUBLIC_NETWORK_LOGO=https://raw.githubusercontent.com/skalenetwork/blockscout/develop/docker-compose/assets/fair/logo.png
      - NEXT_PUBLIC_NETWORK_LOGO_DARK=https://raw.githubusercontent.com/skalenetwork/blockscout/develop/docker-compose/assets/fair/logo_dark.png
      - NEXT_PUBLIC_NETWORK_ICON=https://raw.githubusercontent.com/skalenetwork/blockscout/develop/docker-compose/assets/fair/icon.png
      - NEXT_PUBLIC_NETWORK_ICON_DARK=https://raw.githubusercontent.com/skalenetwork/blockscout/develop/docker-compose/assets/fair/icon.png
      - NEXT_PUBLIC_FOOTER_LINKS=https://raw.githubusercontent.com/skalenetwork/blockscout/develop/docker-compose/assets/fair/footer_links.json
      - NEXT_PUBLIC_RE_CAPTCHA_APP_SITE_KEY=6LesjQUrAAAAAEyS9U4XxT8KC_ZOc50hjOBiX21A
      - NEXT_PUBLIC_HELIA_VERIFIED_FETCH_ENABLED=false
      - NEXT_PUBLIC_STATIC_BLOCK_REWARD=${STATIC_BLOCK_REWARD:-2500000000000000000}

    env_file:
      -  ../envs/common-frontend.env

